[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walletcli"
version = "1.1.0"
description = "A beautiful, secure, self-custody wallet CLI for Ethereum and Tron (ETH, TRX, USDT, USDC) with encrypted vault storage and cross-chain swaps."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "wallet-management" }]
keywords = ["wallet", "crypto", "cli", "ethereum", "tron", "usdt", "usdc"]

dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "cryptography>=42.0",
    "argon2-cffi>=23.1",
    "bip-utils>=2.9",
    "web3>=6.15,<7",
    "tronpy>=0.5",
    "httpx>=0.27",
    "qrcode>=7.4",
    "tomli-w>=1.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
wallet = "walletcli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
